{% load xgame_tags %} {% get_categories as categories %}

<style>
  .category-link {
    display: block;
    padding: 0.55rem 0.9rem;
    border-radius: 10px;
    color: var(--text, #e9ecef);
    text-decoration: none;
    transition: background-color 0.15s;
  }

  .category-link:hover {
    background: var(--surface-2, #262a31);
    color: var(--text, #e9ecef);
  }

  .category-link.active {
    background: var(--accent, #e63946);
    color: #fff;
    box-shadow: 0 4px 10px rgba(230, 57, 70, 0.35);
  }
</style>

<h6 class="panel-title">Categories</h6>
<div class="d-grid gap-1">
  {% for category in categories %}
  <a
    href="{{ category.get_absolute_url }}"
    class="category-link{% if request.resolver_match.kwargs.category_id == category.pk %} active{% endif %}"
    >{{ category.title }}</a
  >
  {% endfor %}
</div>
